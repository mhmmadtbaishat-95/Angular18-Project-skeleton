<div class="login-container">
  <!-- Login Modal -->
  <div class="modal-card">
    <!-- Modal Header with Close Button -->
    <div class="modal-header">
      <button *ngIf="!showSelectionScreen" class="back-btn" type="button" aria-label="Back" (click)="goBackToSelection()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <div *ngIf="showSelectionScreen"></div>
      <button class="close-btn" type="button" aria-label="Close" routerLink="/">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Logo and Organization Name -->
    <div class="modal-logo-section">
      <div class="logo-icon">
        <img 
          src="assets/logo.png" 
          alt="AQARAT"
          class="logo-image"
        />
      </div>
    </div>

    <!-- Selection Screen -->
    <div *ngIf="showSelectionScreen" class="selection-screen">
      <div class="selection-buttons">
        <button
          type="button"
          class="btn-selection"
          (click)="selectLoginType('user')"
        >
          {{ 'auth.login.userRegistration' | t }}
        </button>
        <button
          type="button"
          class="btn-selection"
          (click)="selectLoginType('employee')"
        >
          {{ 'auth.login.employeeRegistration' | t }}
        </button>
      </div>
    </div>

    <!-- Login Form Screen -->
    <div *ngIf="!showSelectionScreen">
      <!-- Login by Username Section -->
      <div class="login-section">
        <h3 class="section-title">{{ 'auth.login.loginByUsername' | t }}</h3>
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
          <!-- Username Field -->
          <div class="form-group">
            <label for="username" class="form-label">
              {{ 'auth.login.username' | t }}
            </label>
            <input
              id="username"
              name="username"
              type="text"
              formControlName="username"
              autocomplete="username"
              class="form-input"
              placeholder="{{ 'auth.login.username' | t }}"
            />
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password" class="form-label">
              {{ 'auth.login.password' | t }}
            </label>
            <input
              id="password"
              name="password"
              type="password"
              formControlName="password"
              autocomplete="current-password"
              required
              class="form-input"
              [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            />
            <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
               class="error-message">
              {{ 'auth.login.passwordRequired' | t }}
            </p>
          </div>

          <!-- Forgot Password Link -->
          <div class="forgot-password-link">
            <a href="#" class="link-text">{{ 'auth.login.forgotPassword' | t }}</a>
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="error-banner">
            <p>{{ errorMessage }}</p>
          </div>

          <!-- Continue Button -->
          <button
            type="submit"
            [disabled]="loginForm.get('password')?.invalid || isLoading"
            class="btn-continue"
          >
            <span *ngIf="!isLoading">{{ 'auth.login.continue' | t }}</span>
            <span *ngIf="isLoading" class="flex items-center justify-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              {{ 'auth.login.signingIn' | t }}
            </span>
          </button>

          <!-- Create Account Link -->
          <div class="create-account-link">
            <a href="#" class="link-text" routerLink="/auth/register">{{ 'auth.login.createNewAccount' | t }}</a>
          </div>
        </form>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Smart Card Login Section -->
      <div class="login-section">
        <h3 class="section-title">{{ 'auth.login.loginBySmartCard' | t }}</h3>
        
        <button
          type="button"
          class="btn-smart-card"
          (click)="onSmartCardLogin()"
        >
          {{ 'auth.login.loginWithSmartCard' | t }}
        </button>

        <div class="smart-card-faq-link">
          <a href="#" class="link-text">{{ 'auth.login.smartCardFAQ' | t }}</a>
        </div>
      </div>
    </div>
  </div>
</div>
