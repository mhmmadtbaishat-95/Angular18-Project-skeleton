<div [class]="'field-wrapper ' + (field.className || '')" 
     [class.col-span-full]="field.type === FieldType.TEXTAREA || field.type === FieldType.FILE">
  
  <!-- Text Input -->
  <div *ngIf="field.type === FieldType.TEXT || field.type === FieldType.EMAIL || field.type === FieldType.TEL || field.type === FieldType.PASSWORD || field.type === FieldType.NUMBER">
    <label [for]="field.key" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">
      {{ field.label }}
      <span *ngIf="field.required" class="text-red-500">*</span>
    </label>
    <input
      [id]="field.key"
      [type]="field.type"
      [formControlName]="field.key"
      [placeholder]="field.placeholder || ''"
      [readonly]="field.readonly"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-qatar-maroon focus:border-qatar-maroon dark:bg-gray-800 dark:text-white transition-all text-xs"
      [class.border-red-500]="hasError()"
    />
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>

  <!-- Textarea -->
  <div *ngIf="field.type === FieldType.TEXTAREA">
    <label [for]="field.key" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">
      {{ field.label }}
      <span *ngIf="field.required" class="text-red-500">*</span>
    </label>
    <textarea
      [id]="field.key"
      [formControlName]="field.key"
      [placeholder]="field.placeholder || ''"
      [rows]="field.rows || 4"
      [readonly]="field.readonly"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-qatar-maroon focus:border-qatar-maroon dark:bg-gray-800 dark:text-white transition-all text-xs"
      [class.border-red-500]="hasError()"
    ></textarea>
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>

  <!-- Select Dropdown -->
  <div *ngIf="field.type === FieldType.SELECT">
    <label [for]="field.key" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">
      {{ field.label }}
      <span *ngIf="field.required" class="text-red-500">*</span>
    </label>
    <select
      [id]="field.key"
      [formControlName]="field.key"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-qatar-maroon focus:border-qatar-maroon dark:bg-gray-800 dark:text-white transition-all text-xs"
      [class.border-red-500]="hasError()"
    >
      <option [value]="''">Select {{ field.label }}</option>
      <option *ngFor="let option of field.options" [value]="option.value" [attr.disabled]="option.disabled ? '' : null">
        {{ option.label }}
      </option>
    </select>
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>

  <!-- Radio Buttons -->
  <div *ngIf="field.type === FieldType.RADIO">
    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-2">
      {{ field.label }}
      <span *ngIf="field.required" class="text-red-500">*</span>
    </label>
    <div class="space-y-2">
      <label *ngFor="let option of field.options" class="flex items-center p-3 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition-all">
        <input
          type="radio"
          [formControlName]="field.key"
          [value]="option.value"
          [disabled]="option.disabled || false"
          class="mr-3 text-qatar-maroon focus:ring-qatar-maroon"
        />
        <span class="text-xs text-gray-700 dark:text-gray-300">{{ option.label }}</span>
      </label>
    </div>
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>

  <!-- Checkbox -->
  <div *ngIf="field.type === FieldType.CHECKBOX">
    <label class="flex items-center p-3 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition-all">
      <input
        type="checkbox"
        [formControlName]="field.key"
        class="mr-3 text-qatar-maroon focus:ring-qatar-maroon"
      />
      <span class="text-xs font-medium text-gray-700 dark:text-gray-300">
        {{ field.label }}
        <span *ngIf="field.required" class="text-red-500">*</span>
      </span>
    </label>
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>

  <!-- Date Input -->
  <div *ngIf="field.type === FieldType.DATE || field.type === FieldType.DATETIME">
    <label [for]="field.key" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">
      {{ field.label }}
      <span *ngIf="field.required" class="text-red-500">*</span>
    </label>
    <input
      [id]="field.key"
      [type]="field.type"
      [formControlName]="field.key"
      [readonly]="field.readonly"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-qatar-maroon focus:border-qatar-maroon dark:bg-gray-800 dark:text-white transition-all text-xs"
      [class.border-red-500]="hasError()"
    />
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>

  <!-- File Input -->
  <div *ngIf="field.type === FieldType.FILE">
    <label [for]="field.key" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">
      {{ field.label }}
      <span *ngIf="field.required" class="text-red-500">*</span>
    </label>
    <input
      [id]="field.key"
      type="file"
      [formControlName]="field.key"
      [accept]="field.accept"
      [multiple]="field.multiple"
      class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-qatar-maroon focus:border-qatar-maroon dark:bg-gray-800 dark:text-white transition-all file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-qatar-maroon file:text-white hover:file:bg-qatar-maroon-light"
      [class.border-red-500]="hasError()"
    />
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>

  <!-- Card Number -->
  <div *ngIf="field.type === FieldType.CARD_NUMBER">
    <label [for]="field.key" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">
      {{ field.label }}
      <span *ngIf="field.required" class="text-red-500">*</span>
    </label>
    <input
      [id]="field.key"
      type="text"
      [formControlName]="field.key"
      [placeholder]="field.placeholder || '1234 5678 9012 3456'"
      (input)="onCardNumberInput($event)"
      maxlength="19"
      class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-qatar-maroon focus:border-qatar-maroon dark:bg-gray-800 dark:text-white transition-all font-mono tracking-wider"
      [class.border-red-500]="hasError()"
    />
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>

  <!-- Card Expiry -->
  <div *ngIf="field.type === FieldType.CARD_EXPIRY">
    <label [for]="field.key" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">
      {{ field.label }}
      <span *ngIf="field.required" class="text-red-500">*</span>
    </label>
    <input
      [id]="field.key"
      type="text"
      [formControlName]="field.key"
      [placeholder]="field.placeholder || 'MM/YY'"
      (input)="onCardExpiryInput($event)"
      maxlength="5"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-qatar-maroon focus:border-qatar-maroon dark:bg-gray-800 dark:text-white transition-all text-xs"
      [class.border-red-500]="hasError()"
    />
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>

  <!-- Card CVV -->
  <div *ngIf="field.type === FieldType.CARD_CVV">
    <label [for]="field.key" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">
      {{ field.label }}
      <span *ngIf="field.required" class="text-red-500">*</span>
    </label>
    <input
      [id]="field.key"
      type="text"
      [formControlName]="field.key"
      [placeholder]="field.placeholder || '123'"
      maxlength="4"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-qatar-maroon focus:border-qatar-maroon dark:bg-gray-800 dark:text-white transition-all text-xs"
      [class.border-red-500]="hasError()"
    />
    <p *ngIf="field.helpText" class="mt-1 text-[11px] text-gray-500 dark:text-gray-400">
      {{ field.helpText }}
    </p>
    <app-error-message *ngIf="hasError()" [message]="getErrorMessage()"></app-error-message>
  </div>
</div>
